name: Instalação do banco
on:
  pull_request:
  push:
    branches: [main]
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkce_install_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste-descartavel
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.3.5'
      - run: python database/build_installers.py --check
      - run: python database/test_install.py
        env:
          LINKCE_TEST_DSN: postgresql://postgres:teste-descartavel@localhost:5432/linkce_install_test
      - name: Validar Compose
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/compose.yml config --quiet
