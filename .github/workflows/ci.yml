name: Linkce CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Relatorio-Linkce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Relatorio-Linkce/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pytest
      - name: Verificar sintaxe
        run: python -m compileall -q .
      - name: Executar testes
        env:
          PYTHONPATH: .
        run: python -m pytest -q
